<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a6cf7, #8a3cf7);
            color: white;
        }
        .box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome!</h1>
        <p>You successfully reached the homepage.</p>
    </div>
</body>
</html>
